<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Theme Button -->
        <button id="themeBtn" class="theme-btn">🌙</button>

        <!-- Calculator -->
        <div class="calculator">

            <input
                type="text"
                class="calculator-screen"
                id="inputbox"
                value=""
                disabled
                placeholder="0"
            >

            <div class="button">
                <button class="operator">AC</button>
                <button class="operator">DEL</button>
                <button class="operator">%</button>
                <button class="operator">/</button>
            </div>

            <div class="button">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>
            </div>

            <div class="button">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>

            <div class="button">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>
            </div>

            <div class="button">
                <button>0</button>
                <button>.</button>
                <button class="equalbtn">=</button>
                <button class="operator">+/-</button>
            </div>

        </div>


        <!-- History -->
        <div class="history">

            <div class="history-header">
                <h2>History</h2>

                <button id="clearHistory">
                    Clear
                </button>
            </div>

            <div id="historyList">
                <p class="empty-history">
                    No calculations yet
                </p>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
